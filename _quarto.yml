project:
  type: website
  render:
    - "*.qmd"
    - "!_archive"
  output-dir: docs

website:
  title: "Public Good Data Wrangle"
  description: "The Public Good Data Wrangle is a 1-day data science hackathon at Davidson College that challenges students to tackle public policy issues through analyzing, visualizing, and presenting data."
  site-url: https://datasci.davidson.edu/datawrangle
  repo-url: https://github.com/DavidsonCollege-DataScience/pg-data-wrangle-site
  open-graph: true # https://quarto.org/docs/websites/website-tools.html#open-graph
  favicon: images/Circle-favicon-32x32.png
  navbar:
    search: false
    right:
      - text: "<span class='btn btn-light'>Register now!</span>"
        href: https://forms.gle/Fbp3XjCReeLyfgcr7
      - text: About
        href: index.qmd#about
      - text: Location
        href: index.qmd#location
      - text: Schedule
        href: index.qmd#schedule
      - text: FAQ
        href: index.qmd#faq
      - text: Organizers
        href: index.qmd#organizers
      - text: Tutorials
        href: tutorials/index.qmd
  page-footer:
    right: "Made with Quarto"
    background: "#0f1012"
    foreground: "#ffffff"

format:
  html:
    # backgroundcolor: "#e6e6e6"
    backgroundcolor: "#ffffff"
    fontcolor: "black"
    linkcolor: "black"
    mainfont: "Atkinson Hyperlegible"
    fontsize: 20px
    theme: [materia, styles.scss]
    lightbox: true
    grid:
      body-width: 1100px # default 800px feels cramped at 20px font

execute:
  freeze: auto
  cache: true

filters:
  # The two plain-cell-output filters sit on either side of code-window so
  # cell output renders as plain text, not as code windows
  - at: pre-quarto
    path: _filters/plain-cell-output.lua
  - at: pre-quarto
    path: code-window
  - at: pre-quarto
    path: _filters/plain-cell-output-cleanup.lua

editor: source
